<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Entrar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#111; color:#fff; padding: 16px; box-sizing: border-box; }
    .card { max-width: 340px; width: 100%; padding: 24px; text-align:center; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color:#9aa0a6; font-size: 14px; margin-bottom: 20px; }
    input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #333; background:#1c1c1c; color:#fff; font-size:15px; box-sizing:border-box; margin-bottom: 10px; }
    button { width:100%; margin-top:6px; padding:14px; background:#fff; color:#111; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #msg { margin-top:16px; font-size:13px; color:#9aa0a6; }
    #msg.error { color: #f87171; }
    .links { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
    a { color:#9aa0a6; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar no Falso Magro</h1>
    <p>Digite seu e-mail e senha para acessar.</p>
    <input type="email" id="email" placeholder="seuemail@exemplo.com" />
    <input type="password" id="password" placeholder="Sua senha" />
    <button id="loginBtn">Entrar</button>
    <div id="msg"></div>
    <div class="links">
      <a href="/esqueci-senha.html">Esqueci minha senha</a>
      <a href="/ativar.html">Comprei e ainda não ativei meu acesso</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const msgEl = document.getElementById("msg");

    async function attemptLogin() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !email.includes("@")) {
        msgEl.textContent = "Digite um e-mail válido.";
        msgEl.className = "error";
        return;
      }
      if (!password) {
        msgEl.textContent = "Digite sua senha.";
        msgEl.className = "error";
        return;
      }

      loginBtn.disabled = true;
      msgEl.textContent = "Entrando...";
      msgEl.className = "";

      const result = await Auth.signInWithPassword(email, password);

      if (!result.ok) {
        msgEl.textContent = result.error;
        msgEl.className = "error";
        loginBtn.disabled = false;
        return;
      }

      window.location.href = "/index.html";
    }

    loginBtn.addEventListener("click", attemptLogin);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptLogin();
    });
  </script>
</body>
</html>
