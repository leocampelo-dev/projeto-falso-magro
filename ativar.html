<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ativar meu acesso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#111; color:#fff; padding: 16px; box-sizing: border-box; }
    .card { max-width: 360px; width: 100%; padding: 24px; text-align:center; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color:#9aa0a6; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #333; background:#1c1c1c; color:#fff; font-size:15px; box-sizing:border-box; margin-bottom: 10px; }
    button { width:100%; margin-top:6px; padding:14px; background:#fff; color:#111; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    button.secondary { background: transparent; color: #fff; border: 1px solid #333; margin-top: 10px; }
    #msg { margin-top:16px; font-size:13px; color:#9aa0a6; min-height: 18px; }
    #msg.error { color: #f87171; }
    #msg.success { color: #4ade80; }
    .hidden { display: none; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #444; border-top-color:#fff; border-radius:50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Passo 1: identificar compra -->
    <div id="stepEmail">
      <h1>Ativar meu acesso</h1>
      <p>Digite o e-mail que você usou na compra. Vamos confirmar seu pagamento e liberar seu acesso.</p>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" />
      <button id="checkBtn">Verificar minha compra</button>
    </div>

    <!-- Passo 2: criar senha -->
    <div id="stepPassword" class="hidden">
      <h1>Quase lá!</h1>
      <p>Compra confirmada. Crie uma senha para acessar o Falso Magro em qualquer dispositivo.</p>
      <input type="password" id="password" placeholder="Crie uma senha (mín. 8 caracteres)" />
      <input type="password" id="passwordConfirm" placeholder="Confirme a senha" />
      <button id="activateBtn">Criar senha e ativar acesso</button>
    </div>

    <!-- Sucesso -->
    <div id="stepDone" class="hidden">
      <h1>Acesso ativado! 🎉</h1>
      <p id="doneMsg">Sua conta está pronta. Entrando automaticamente...</p>
      <button id="goToLoginBtn" class="hidden">Ir para o login</button>
    </div>

    <div id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script>
    const SUPABASE_URL = "https://aermveqwolvxeilnmuog.supabase.co";

    // Polling da race condition: o webhook da Kiwify pode levar alguns
    // segundos para processar. Tentamos várias vezes antes de dizer que
    // não encontramos a compra.
    const POLL_INTERVAL_MS = 3000;
    const MAX_POLL_ATTEMPTS = 10; // ~30s de tentativas

    const stepEmail = document.getElementById("stepEmail");
    const stepPassword = document.getElementById("stepPassword");
    const stepDone = document.getElementById("stepDone");
    const emailInput = document.getElementById("email");
    const checkBtn = document.getElementById("checkBtn");
    const passwordInput = document.getElementById("password");
    const passwordConfirmInput = document.getElementById("passwordConfirm");
    const activateBtn = document.getElementById("activateBtn");
    const goToLoginBtn = document.getElementById("goToLoginBtn");
    const msgEl = document.getElementById("msg");

    let confirmedEmail = "";

    function setMsg(text, type) {
      msgEl.textContent = text || "";
      msgEl.className = type || "";
    }

    async function callFunction(name, payload) {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function pollPurchaseStatus(email) {
      for (let attempt = 1; attempt <= MAX_POLL_ATTEMPTS; attempt++) {
        const { ok, data } = await callFunction("check-purchase-status", { email });

        if (!ok && data?.status !== "not_found") {
          // erro real (rate limit, e-mail inválido, erro interno)
          return { status: data?.status || "error", error: data?.error };
        }

        if (data?.status === "active") return data;
        if (data?.status === "blocked") return data;
        if (data?.status === "expired") return data;

        // status "not_found": ainda pode ser processamento em andamento.
        setMsg(
          `Confirmando seu pagamento com a Kiwify... (tentativa ${attempt}/${MAX_POLL_ATTEMPTS})`,
        );
        if (attempt < MAX_POLL_ATTEMPTS) await sleep(POLL_INTERVAL_MS);
      }
      return { status: "not_found" };
    }

    checkBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim().toLowerCase();
      if (!email || !email.includes("@")) {
        setMsg("Digite um e-mail válido.", "error");
        return;
      }

      checkBtn.disabled = true;
      setMsg("Verificando...");

      const result = await pollPurchaseStatus(email);

      checkBtn.disabled = false;

      if (result.status === "active") {
        if (result.alreadyActivated) {
          setMsg("Esta conta já está ativada. Redirecionando para o login...", "success");
          setTimeout(() => (window.location.href = "/entrar.html"), 1800);
          return;
        }
        confirmedEmail = email;
        stepEmail.classList.add("hidden");
        stepPassword.classList.remove("hidden");
        setMsg("");
        return;
      }

      if (result.status === "blocked") {
        setMsg(
          "Não conseguimos liberar o acesso para esta compra. Se você acredita que isso é um engano, fale com o suporte.",
          "error",
        );
        return;
      }

      if (result.status === "expired") {
        setMsg("Seu acesso expirou. Entre em contato com o suporte para renovar.", "error");
        return;
      }

      if (result.status === "rate_limited") {
        setMsg(result.error || "Muitas tentativas. Aguarde alguns minutos.", "error");
        return;
      }

      // not_found após todas as tentativas
      setMsg(
        "Ainda não encontramos sua compra. Se você acabou de comprar, aguarde 1 minuto e clique em 'Verificar minha compra' de novo. Se o problema continuar, fale com o suporte pelo WhatsApp.",
        "error",
      );
    });

    activateBtn.addEventListener("click", async () => {
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;

      if (password.length < 8) {
        setMsg("A senha precisa ter pelo menos 8 caracteres.", "error");
        return;
      }
      if (password !== passwordConfirm) {
        setMsg("As senhas não coincidem.", "error");
        return;
      }

      activateBtn.disabled = true;
      setMsg("Criando sua conta...");

      const { ok, data } = await callFunction("activate-account", {
        email: confirmedEmail,
        password,
      });

      activateBtn.disabled = false;

      if (!ok) {
        setMsg(data?.error || "Erro ao ativar. Tente novamente.", "error");
        return;
      }

      stepPassword.classList.add("hidden");
      stepDone.classList.remove("hidden");
      setMsg("");

      // Login automático: a pessoa acabou de digitar essa senha agora
      // mesmo, então não faz sentido pedir de novo numa tela separada.
      // Se por algum motivo o login automático falhar, cai no fallback
      // manual (botão "Ir para o login") em vez de travar a pessoa aqui.
      const doneMsgEl = document.getElementById("doneMsg");
      const loginResult = await SupabaseClient.signInWithPassword(confirmedEmail, password);

      if (loginResult.ok) {
        window.location.href = "/index.html";
      } else {
        doneMsgEl.textContent = "Conta criada! Faça login com o e-mail e a senha que você acabou de criar.";
        goToLoginBtn.classList.remove("hidden");
      }
    });

    goToLoginBtn.addEventListener("click", () => {
      window.location.href = "/entrar.html";
    });
  </script>
</body>
</html>
